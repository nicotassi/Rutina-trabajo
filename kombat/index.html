<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kombat Training</title>
<meta name="theme-color" content="#f5f5f7" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kombat">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--tx:#1c1c1e;--mu:#8a8a8e;--bd:#e5e5ea;--fill:#f0f0f3;--sw:#d9d9de;
  --red:#e8272a;--orange:#f07020;--blue:#2680f0;--green:#1fa355;
  --nav:rgba(255,255,255,.88);--sh:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
[data-theme=dark]{--bg:#000;--card:#161618;--tx:#f2f2f4;--mu:#8e8e93;--bd:#2a2a2e;--fill:#232327;--sw:#3a3a3f;
  --red:#ff4d42;--orange:#ff9f0a;--blue:#4c9bff;--green:#32d46b;--nav:rgba(22,22,24,.88);--sh:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;font-size:16px}
[data-fs=s]{font-size:14.5px}[data-fs=l]{font-size:18px}[data-fs=xl]{font-size:20px}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.45 var(--font);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(5.2rem + env(safe-area-inset-bottom));overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:1.3rem 1.1rem}
.hidden{display:none!important}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
h1{font-size:2.05rem;font-weight:800;letter-spacing:-.03em;line-height:1.12}
h3{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.8rem}
.head{margin-bottom:1rem}
.note{font-size:.82rem;color:var(--mu);margin:.5rem .2rem 1rem}
.grp-t{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin:1.4rem .3rem .5rem}
.pills{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem}
.pill{font-size:.8rem;font-weight:600;background:var(--card);border:1px solid var(--bd);border-radius:2rem;padding:.3rem .8rem}
.pill b{color:var(--red)}

/* botones */
.btn{border:0;background:var(--fill);border-radius:.85rem;padding:.8rem 1rem;font-weight:600;font-size:.95rem;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.8}
.btn.pri{background:var(--c,var(--red));color:#fff}
.btn.big{width:100%;padding:1rem;font-size:1.05rem;margin-top:.7rem}
.btn.danger{color:var(--red)}
.btn.ghost{background:none;color:var(--c,var(--red));padding:.5rem .6rem}
.btn[disabled]{opacity:.35;pointer-events:none}

/* tarjetas de entrenamiento */
.wcard{background:var(--card);border:1px solid var(--bd);border-radius:1.3rem;padding:1.1rem;margin-bottom:.85rem;box-shadow:var(--sh)}
.c-hiit{--c:var(--red)}.c-cal{--c:var(--orange)}.c-pir{--c:var(--blue)}
.wc-top{display:flex;align-items:center;gap:.9rem;margin-bottom:.9rem}
.wc-ico{width:3rem;height:3rem;border-radius:.9rem;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.wc-ico svg{width:1.6rem;height:1.6rem;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wc-t{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.wc-s{font-size:.82rem;color:var(--mu)}
.wc-btns{display:flex;gap:.5rem}.wc-btns .pri{flex:1}
.days{margin-bottom:.8rem;overflow-x:auto}.days button{flex:1 0 auto;padding:.5rem .8rem}
.seg{display:flex;background:var(--fill);border-radius:.8rem;padding:.2rem;gap:.15rem}
.seg{min-width:0}.seg button{flex:1 1 0;min-width:0;border:0;background:none;border-radius:.62rem;padding:.5rem .3rem;font-weight:600;font-size:.85rem;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.14)}
[data-theme=dark] .seg button.on{background:#3a3a3f}
.install{display:flex;align-items:center;gap:.8rem;background:color-mix(in srgb,var(--red) 10%,var(--card));border:1px solid color-mix(in srgb,var(--red) 30%,var(--bd));border-radius:1.1rem;padding:.8rem 1rem;margin-bottom:.9rem}
.install .sp{flex:1;font-size:.88rem;font-weight:500}

/* listas */
.grp{background:var(--card);border:1px solid var(--bd);border-radius:1rem;overflow:hidden}
.li{display:flex;align-items:center;gap:.7rem;padding:.75rem .95rem;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:0}
.sp{flex:1;min-width:0}
.li-t{font-weight:600}.li-s{font-size:.8rem;color:var(--mu)}
.idx{font-size:.8rem;font-weight:700;color:var(--mu);width:1.3rem}
.inl{border:0;background:none;padding:.25rem 0;flex:1;min-width:0;font-weight:500;outline:none;font-size:max(16px,1rem)}
.mv{display:flex;gap:.1rem}
.mv button{border:0;background:none;color:var(--mu);width:2rem;height:2rem;font-size:.8rem}
.mv button.danger{color:var(--red)}.mv button[disabled]{opacity:.25}
.stp{display:flex;align-items:center;gap:.35rem}
.stp button{width:2.1rem;height:2.1rem;border-radius:50%;border:0;background:var(--fill);font-size:1.2rem;font-weight:600;line-height:1}
.stp span{min-width:3.4rem;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.sw{width:3rem;height:1.8rem;border-radius:1rem;background:var(--sw);border:0;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(1.2rem)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.95rem}
.chip{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .55rem;border-radius:.4rem;color:var(--c,var(--red));background:color-mix(in srgb,var(--c,var(--red)) 13%,transparent)}

/* inputs / hojas */
input[type=text],input[type=number],textarea,select{width:100%;padding:.75rem .85rem;border:1px solid var(--bd);border-radius:.75rem;background:var(--bg);font-size:max(16px,1rem);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--red)}
textarea{resize:none;min-height:5.5rem}
.lbl{display:block;font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin:.9rem 0 .35rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.modal>div{background:var(--card);width:100%;max-width:560px;border-radius:1.4rem 1.4rem 0 0;padding:.6rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.grab{width:2.6rem;height:.28rem;border-radius:1rem;background:var(--bd);margin:0 auto .9rem}
.row2{display:flex;gap:.5rem}.row2>*{flex:1}
.combo{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--bg);border-radius:.9rem;padding:.8rem .9rem;margin-bottom:.5rem}
.combo b{display:block;margin:.3rem 0 .1rem}.combo small{display:block;color:var(--mu);font-size:.78rem;line-height:1.35}

/* pantallas superpuestas */
.page{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;display:none}
.page.on{display:block}
.page-top{position:sticky;top:0;z-index:2;background:var(--nav);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:.4rem .6rem;padding-top:calc(.4rem + env(safe-area-inset-top))}
.page-t{font-weight:700}

/* nav inferior */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--bd);display:flex;padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;border:0;background:none;font-size:.68rem;font-weight:600;color:var(--mu);padding:.3rem 0;display:flex;flex-direction:column;align-items:center;gap:.2rem}
.nav svg{width:1.55rem;height:1.55rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--red)}

/* entrenamiento activo */
.run{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;--acc:var(--red)}
.run.on{display:flex}
.run-top{display:flex;align-items:center;justify-content:space-between;padding:.5rem .7rem;padding-top:calc(.5rem + env(safe-area-inset-top));flex:none}
.run-title{font-weight:700}
.run-el{font-variant-numeric:tabular-nums;font-weight:600;color:var(--mu);min-width:4.5rem;text-align:right}
.run-body{flex:1;overflow:auto;display:flex;flex-direction:column}
.run-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:1rem 1.4rem;text-align:center}
.run-ctl{display:flex;gap:.6rem;padding:.8rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));flex:none;max-width:560px;width:100%;margin:0 auto}
.run-ctl .btn{margin-top:0;min-width:5.5rem}.run-ctl .btn.pri{flex:1;background:var(--c,var(--acc))}
.phase-chip{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.phase-big{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.phase-sub{font-size:.95rem;color:var(--mu)}
.ring{position:relative;width:min(15rem,68vw);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--fill);stroke-width:9}
.rp{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .3s}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rnum{font-size:3.5rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.rsub{font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin-top:.25rem}
.bar{height:.3rem;border-radius:1rem;background:var(--fill);overflow:hidden;width:min(18rem,80vw)}
.bar i{display:block;height:100%;background:var(--acc);border-radius:1rem;transition:width .4s}
.run-scroll{padding:1.2rem 1.2rem 1rem;max-width:560px;margin:0 auto;width:100%}
.ex-name{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:.3rem 0 .6rem}
.ex-desc{color:var(--mu);margin-top:.8rem;font-size:.95rem;line-height:1.55}
.series{display:flex;gap:.5rem}
.sb{flex:1;height:3rem;border-radius:.8rem;background:var(--fill);display:grid;place-items:center;font-weight:700;color:var(--mu)}
.sb.cur{outline:2px solid var(--acc);color:var(--tx)}
.sb.done{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.repstep{display:flex;align-items:center;justify-content:center;gap:1.4rem;padding:.4rem 0}
.repstep button{width:3.2rem;height:3.2rem;border-radius:50%;border:0;background:var(--fill);font-size:1.6rem;font-weight:600}
.repstep div{font-size:4.6rem;font-weight:800;letter-spacing:-.04em;min-width:6.5rem;text-align:center;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1}
.pbars{display:flex;align-items:flex-end;justify-content:center;gap:.28rem;min-height:4.6rem}
.pb{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.pb span{font-size:.72rem;font-weight:700;color:var(--mu)}.pb span.on{color:var(--tx)}
.pb i{display:block;width:1.55rem;border-radius:.35rem;background:var(--fill)}
.pb i.done{background:color-mix(in srgb,var(--acc,var(--blue)) 40%,transparent)}
.pb i.cur{background:var(--acc,var(--blue))}
.pbs{--acc:var(--blue)}
.big-reps{font-size:6rem;font-weight:800;letter-spacing:-.04em;color:var(--blue);line-height:1}
.sum-ico{width:5rem;height:5rem;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 15%,transparent);font-size:2.4rem;color:var(--acc)}
.sum-rows{display:flex;gap:.6rem;width:100%;max-width:22rem}
.sum-rows div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:1rem;padding:.8rem .4rem}
.sum-rows b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.sum-rows small{font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}

/* análisis */
.ins{display:flex;gap:.8rem;align-items:flex-start}
.ins-ic{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:800;margin-top:.1rem}
.ins-ic.good{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.ins-ic.warn{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange)}
.ins-ic.info{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.ins-t{font-weight:600;line-height:1.3}.ins-d{font-size:.84rem;color:var(--mu);margin-top:.15rem;line-height:1.4}
.ocr-pre{font-size:.7rem;white-space:pre-wrap;color:var(--mu);background:var(--bg);border-radius:.6rem;padding:.6rem;max-height:9rem;overflow:auto;margin-top:.4rem;-webkit-user-select:text;user-select:text}
.shot-row{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.shot-row span{font-size:.78rem;font-weight:600;background:var(--card);border:1px solid var(--bd);border-radius:2rem;padding:.25rem .7rem}
/* progreso */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.9rem}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:1.1rem;padding:.9rem 1rem}
.kpi b{display:block;font-size:1.8rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi small{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.chart{display:flex;align-items:flex-end;gap:.45rem;height:8rem;padding-top:1rem}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:.2rem;min-width:0}
.chart .b i{display:block;width:100%;border-radius:.4rem .4rem .15rem .15rem;background:var(--red);min-height:3px}
.chart .b i.z{background:var(--fill)}
.chart .b em{font-style:normal;font-size:.66rem;font-weight:700}
.chart-l{display:flex;gap:.45rem;margin-top:.4rem}.chart-l span{flex:1;text-align:center;font-size:.62rem;color:var(--mu)}
.tbar{margin-bottom:.8rem}.tbar:last-child{margin-bottom:0}
.tbar-h{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;margin-bottom:.3rem}
.tbar-h span:last-child{color:var(--mu);font-weight:500}
.tbar .bar{width:100%;height:.5rem}.tbar .bar i{background:var(--c)}
.dots{display:flex;gap:.3rem}
.dots div{flex:1;text-align:center;font-size:.62rem;color:var(--mu);font-weight:600}
.dots i{display:block;aspect-ratio:1;border-radius:50%;background:var(--fill);margin-bottom:.25rem}
.dots i.on{background:var(--green)}
.prog{display:flex;align-items:center;gap:.8rem}
.prog svg{width:5.5rem;height:1.8rem;flex:none}
.prog svg polyline{fill:none;stroke:var(--orange);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.delta{font-size:.78rem;font-weight:700;min-width:2.4rem;text-align:right}
.delta.up{color:var(--green)}.delta.dn{color:var(--red)}.delta.eq{color:var(--mu)}
.hday{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);margin:1.2rem .3rem .45rem}
.hi{display:flex;align-items:center;gap:.8rem;padding:.8rem .95rem;border-bottom:1px solid var(--bd)}.hi:last-child{border-bottom:0}
.hi .wc-ico{width:2.5rem;height:2.5rem;border-radius:.75rem}
.hi .wc-ico svg{width:1.3rem;height:1.3rem}
.hi-t{font-weight:600}.hi-s{font-size:.8rem;color:var(--mu)}.hi-d{font-size:.74rem;color:var(--mu);margin-top:.15rem;line-height:1.35}
.hi .x{border:0;background:none;color:var(--mu);font-size:1.05rem;padding:.4rem}
.empty{text-align:center;color:var(--mu);padding:2.6rem 1rem;line-height:1.7}

.toast{position:fixed;left:50%;bottom:calc(6rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;font-size:.88rem;font-weight:500;z-index:90;max-width:88vw;text-align:center}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
.pop{animation:pop .4s ease}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="view"></div>

<nav class="nav">
  <button data-t="entrenar" onclick="go('entrenar')"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Entrenar</button>
  <button data-t="progreso" onclick="go('progreso')"><svg viewBox="0 0 24 24"><path d="M4 4v16h16M8 15l3.5-4.5 3 2.5L19 7"/></svg>Progreso</button>
  <button data-t="ajustes" onclick="go('ajustes')"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Ajustes</button>
</nav>

<div class="page" id="page"></div>

<div class="run" id="run">
  <div class="run-top"><button class="btn ghost" onclick="exitRun()">Salir</button><div class="run-title" id="run-title"></div><div class="run-el" id="run-el">0:00</div></div>
  <div class="run-body" id="run-body"></div>
  <div class="run-ctl" id="run-ctl"></div>
</div>

<script>
// ============================================================ UTILIDADES
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const fmtMS=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtLong=s=>s<3600?Math.max(0,Math.round(s/60))+' min':Math.floor(s/3600)+' h '+Math.round(s%3600/60)+' min';
let toastT=null;
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2200)}

// ============================================================ DATOS
const DEF_HIIT=['Rodillas','Middles','Sentadillas con salto','Burpees','Check y middle','Plancha','Abs escalando','1 y 2 con pesas','Ganchos con pesas','Upper con pesas'];
const DEF_A=[
 {n:'Archer Push-ups',m:'Pecho',d:'Brazos bien abiertos. Bajá hacia un lado manteniendo el otro estirado. Alternando. Control total.',s:3,r:10},
 {n:'Pseudo Planche Push-ups',m:'Pecho · Hombros',d:'Manos giradas hacia atrás, cuerpo inclinado al frente. Bajá muy lento, empuje explosivo.',s:3,r:10},
 {n:'Pike Push-ups',m:'Hombros',d:'Cadera alta formando una V invertida. Bajá la cabeza entre las manos hasta casi tocar el piso.',s:3,r:10},
 {n:'Dips en silla',m:'Tríceps',d:'Manos en el borde, cuerpo vertical. Bajá hasta 90° de codo. Subida explosiva.',s:3,r:10},
 {n:'L-Sit',m:'Core',d:'Apoyado en manos, piernas extendidas al frente. Sostené 10 segundos por repetición.',s:3,r:10},
 {n:'Bulgarian Split Squat',m:'Piernas',d:'Pie trasero elevado, bajá la rodilla casi al piso. 10 reps por pierna. Control en la bajada.',s:3,r:10},

function beep(f=880,dur=150,type='sine',vol=.3){
  if(!D.set.sound)return;
  try{const c=getAC();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur/1000);
    o.start();o.stop(c.currentTime+dur/1000+.05)}catch(e){}}

  const e=Object.assign({id:uid(),ts:Date.now()-sec*1000,tipo,detalle,sec},extra||{});D.hist.push(e);save();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}
  return e.id}
const dayNum=ts=>{const d=new Date(ts);return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
function mondayOf(d){const m=new Date(d);m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));return m}
function streaks(){
  const nums=[...new Set(D.hist.map(e=>dayNum(e.ts)))].sort((a,b)=>a-b);
  let best=0,run=0,prev=null;
  nums.forEach(n=>{run=(prev!==null&&n===prev+1)?run+1:1;best=Math.max(best,run);prev=n});
  const set=new Set(nums);let d=dayNum(Date.now());if(!set.has(d))d--;
  let cur=0;while(set.has(d)){cur++;d--}
  return{cur,best}}
function weekCount(){const m=mondayOf(new Date()).getTime();return D.hist.filter(e=>e.ts>=m).length}
function dayLabel(ts){const k=dayNum(ts),t=dayNum(Date.now());
  if(k===t)return'Hoy';if(k===t-1)return'Ayer';
  return new Date(ts).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}

let R=null,RINT=null;
const SESS={acc:0,last:0,on:false};
function sStart(){SESS.acc=0;SESS.last=Date.now();SESS.on=true}
function sFlush(){if(SESS.on){const n=Date.now();SESS.acc+=n-SESS.last;SESS.last=n}}
function sPause(){sFlush();SESS.on=false}
function sResume(){SESS.last=Date.now();SESS.on=true}
function sSec(){sFlush();return Math.round(SESS.acc/1000)}
function beginRun(title,color){
  sStart();$('run').style.setProperty('--acc',color);$('run-title').textContent=title;$('run').classList.add('on');
  acquireWake();beepStart();drawRun();clearInterval(RINT);RINT=setInterval(tick,250)}
function tick(){
  if(!R||R.done)return;
  $('run-el').textContent=fmtMS(sSec());
  if(R.mode==='hiit')tickHiit();else if(R.mode==='cal')tickCal();else tickPir()}
function exitRun(){
  if(R&&!R.done&&sSec()>5&&!confirm('¿Salir del entrenamiento? No se va a guardar.'))return;
  closeRun()}
function closeRun(){clearInterval(RINT);RINT=null;R=null;releaseWake();$('run').classList.remove('on');render()}
function drawRun(){if(R.done)return;({hiit:drawHiit,cal:drawCal,pir:drawPir})[R.mode]()}
function ring(color,num,sub){return `<div class="ring"><svg viewBox="0 0 210 210"><circle class="rbg" cx="105" cy="105" r="93"/><circle id="ringp" class="rp" cx="105" cy="105" r="93" stroke-dasharray="584.3" stroke-dashoffset="0" style="stroke:${color}"/></svg><div class="ring-in"><div class="rnum" id="rnum">${num}</div><div class="rsub">${sub}</div></div></div>`}
function setRing(left,total){const r=$('ringp');if(r)r.style.strokeDashoffset=584.3*(1-clamp(left/total,0,1));const n=$('rnum');if(n)n.textContent=fmtMS(left)}
function drawSummary(o){
  R.done=true;R.sumOpts=o;clearInterval(RINT);releaseWake();$('run-el').textContent=fmtMS(o.sec);
  const en=D.hist.find(e=>e.id===o.id),oc=en&&en.ocr;
  $('run-body').innerHTML=`<div class="run-mid fade"><div class="sum-ico">✓</div><div class="phase-big">¡Listo!</div><div class="phase-sub">${esc(o.sub)} · guardado en tu historial</div>
    <div class="sum-rows">${o.rows.map(r=>`<div><b>${r[1]}</b><small>${r[0]}</small></div>`).join('')}</div>
    ${oc?`<div class="shot-row">${ocrChips(oc)}</div>`:''}
    <button class="btn" onclick="ocrOpen('${o.id}')">📷 ${oc?'Cambiar':'Agregar'} captura del reloj</button></div>`;
  $('run-ctl').innerHTML=`<button class="btn" onclick="closeRun()">Cerrar</button><button class="btn pri" onclick="closeRun();${o.again}">Repetir</button>`}
function togglePause(){
  if(!R||R.done)return;
  if(R.run){R.rem=Math.max(0,R.end-Date.now());R.run=false;sPause();releaseWake()}
  else{R.end=Date.now()+R.rem;R.run=true;sResume();acquireWake()}
  const b=$('pbtn');if(b)b.textContent=R.run?'Pausa':'Continuar'}
function skipPhase(){if(!R||R.done)return;if(R.run){R.end=Date.now();tick()}else R.rem=0}

// ============================================================ HIIT
function startHIIT(){
  const ex=D.hiit.ejercicios.filter(x=>x.trim());
  if(!ex.length){toast('Agregá al menos un ejercicio');return}
  R={mode:'hiit',ex,step:0,phase:'soga',end:Date.now()+D.hiit.soga*1000,run:true,rem:0,left:D.hiit.soga,lastLeft:-1};
  beginRun('HIIT','var(--red)')}
function tickHiit(){
  if(!R.run)return;
  let ch=false;const T=D.hiit;
  while(Date.now()>=R.end){
    if(R.phase==='soga'){R.phase='ex';R.end+=T.ex*1000}
    else{R.step++;if(R.step>=R.ex.length)return finishHiit();R.phase='soga';R.end+=T.soga*1000}
    ch=true}
  R.left=Math.ceil((R.end-Date.now())/1000);
  if(ch){beepChange();drawRun()}
  else{if(R.left!==R.lastLeft&&R.left<=3&&R.left>0)beepTick();setRing(R.left,R.phase==='soga'?T.soga:T.ex)}
  R.lastLeft=R.left}
function drawHiit(){
  const soga=R.phase==='soga',n=R.ex.length,col=soga?'var(--red)':'var(--orange)',T=D.hiit;
  R.left=Math.ceil((R.end-Date.now())/1000);if(!R.run)R.left=Math.ceil(R.rem/1000);
  $('run-body').innerHTML=`<div class="run-mid"><div class="phase-chip" style="color:${col}">${soga?'Soga':'Ejercicio'}</div>
    ${ring(col,fmtMS(R.left),'Ronda '+(R.step+1)+' / '+n)}
    <div class="phase-big">${soga?'Soga':esc(R.ex[R.step])}</div>
    <div class="phase-sub">${soga?'A continuación: '+esc(R.ex[R.step]):(R.step<n-1?'Siguiente: '+esc(R.ex[R.step+1]):'Último ejercicio 🔥')}</div>
    <div class="bar"><i style="width:${(R.step+(soga?0:.5))/n*100}%"></i></div></div>`;
  $('run-ctl').innerHTML=`<button class="btn" id="pbtn" onclick="togglePause()">${R.run?'Pausa':'Continuar'}</button><button class="btn pri" style="--c:${col}" onclick="skipPhase()">Saltar ›</button>`;
  setRing(R.left,soga?T.soga:T.ex)}
function finishHiit(){
  const sec=sSec(),id=addHist('hiit',R.ex.length+' rondas',sec);beepFinish();
  drawSummary({id,sec,sub:'HIIT completado',rows:[['Tiempo',fmtMS(sec)],['Rondas',R.ex.length]],again:'startHIIT()'})}

    <span class="lbl">Repeticiones hechas</span><div class="repstep"><button onclick="calRep(-1)">−</button><div id="repn">${R.cur}</div><button onclick="calRep(1)">+</button></div></div>`;
  $('run-ctl').innerHTML=`<button class="btn pri big" onclick="calDone()">Serie ${R.serie+1} completada ✓</button>`}
function calRep(d){R.cur=Math.max(0,R.cur+d);$('repn').textContent=R.cur}
function calDone(){
  const e=R.dia.ej[R.ex];R.logs[R.ex].push(R.cur);beep(660,100);vib(30);
  R.serie++;let nextEx=false;
  if(R.serie>=e.s){R.ex++;R.serie=0;nextEx=true;if(R.ex>=R.dia.ej.length)return finishCal()}
  R.cur=R.dia.ej[R.ex].r;
  if(D.cal.rest<=0){drawRun();return}
  R.phase='rest';R.nextEx=nextEx;R.total=D.cal.rest;R.end=Date.now()+R.total*1000;R.left=R.total;R.lastLeft=-1;beepChange();drawRun()}

function tickCal(){
  if(R.phase!=='rest')return;
  const left=Math.ceil((R.end-Date.now())/1000);
  if(left<=0){R.phase='work';drawRun();beepStart();return}
  if(left!==R.lastLeft&&left<=3)beepTick();
  R.left=left;R.lastLeft=left;setRing(left,R.total)}
function finishCal(){
  const sec=sSec(),ej=R.dia.ej.map((e,i)=>({n:e.n,r:R.logs[i]})).filter(x=>x.r.length);
  const reps=ej.reduce((a,x)=>a+x.r.reduce((p,q)=>p+q,0),0);
  const id=addHist('cal',R.dia.nombre+(R.dia.sub?' · '+R.dia.sub:''),sec,{ej});beepFinish();
  drawSummary({id,sec,sub:R.dia.nombre+' completado',rows:[['Tiempo',fmtMS(sec)],['Ejercicios',ej.length],['Reps',reps]],again:'startCal()'})}

// ============================================================ PIRAMIDALES
function pirChoose(){
  const c=D.pir.combos;if(!c.length){toast('Agregá un combo en Editar');return}
  openSheet(`<h3>Elegí un combo</h3>${c.map((x,i)=>`<button class="combo" onclick="closeSheet();startPir(${i})"><span class="chip" style="--c:var(--blue)">${esc(x.t)}</span><b>${esc(x.n)}</b><small>${esc(x.d)}</small></button>`).join('')}`)}
function startPir(i){
  const P=D.pir;if(!P.niveles.length){toast('Definí los niveles');return}
  R={mode:'pir',combo:P.combos[i],lvl:0,phase:'work',run:true,rem:0,end:Date.now()+P.work*1000,left:P.work,lastLeft:-1,total:P.work};
  beginRun('Piramidal','var(--blue)')}
function pbars(niv,lvl,phase){
  const mx=Math.max(...niv);
  return niv.map((r,i)=>{const dn=i<lvl||(phase==='rest'&&i===lvl),cu=phase==='work'&&i===lvl;
    return `<div class="pb"><span class="${cu?'on':''}">${r}</span><i class="${dn?'done':cu?'cur':''}" style="height:${(r/mx*3+.5).toFixed(2)}rem"></i></div>`}).join('')}
function drawPir(){
  const P=D.pir,c=R.combo,n=P.niveles.length,reps=P.niveles[R.lvl],last=R.lvl>=n-1;
  const head=`<div style="text-align:center;padding:.4rem 1.2rem 0"><span class="chip" style="--c:var(--blue)">${esc(c.t)}</span><div class="phase-big" style="font-size:1.35rem;margin-top:.4rem">${esc(c.n)}</div></div>
    <div class="pbars pbs" style="padding:1rem 1rem .3rem">${pbars(P.niveles,R.lvl,R.phase)}</div>`;
  if(!P.timer){
    $('run-body').innerHTML=head+`<div class="run-mid"><div class="big-reps pop">${reps}</div><div class="phase-chip" style="color:var(--blue)">Repeticiones</div><div class="phase-sub">Nivel ${R.lvl+1} de ${n}</div></div>`;
    $('run-ctl').innerHTML=`<button class="btn pri big" style="--c:var(--blue)" onclick="pirNext()">${last?'Terminar':'Siguiente nivel ›'}</button>`;return}
  const work=R.phase==='work';R.left=R.run?Math.ceil((R.end-Date.now())/1000):Math.ceil(R.rem/1000);
  const nextReps=P.niveles[R.lvl+1];
  $('run-body').innerHTML=head+`<div class="run-mid"><div class="phase-chip" style="color:${work?'var(--blue)':'var(--green)'}">${work?'Trabajo':'Descanso'}</div>
    ${ring(work?'var(--blue)':'var(--green)',fmtMS(R.left),work?'Nivel '+(R.lvl+1):'Descanso')}
    <div class="phase-big">${work?reps+' repeticiones':nextReps+' repeticiones'}</div><div class="phase-sub">${work?(last?'Último nivel':'Siguiente: '+nextReps+' reps'):'Próximo nivel '+(R.lvl+2)+' de '+n}</div></div>`;
  $('run-ctl').innerHTML=`<button class="btn" id="pbtn" onclick="togglePause()">${R.run?'Pausa':'Continuar'}</button><button class="btn pri" style="--c:var(--blue)" onclick="skipPhase()">${work&&last?'Terminar':'Saltar ›'}</button>`;
  setRing(R.left,R.total)}
function pirNext(){beep(660,100);vib(30);R.lvl++;if(R.lvl>=D.pir.niveles.length)return finishPir();drawRun()}
function tickPir(){
  const P=D.pir;if(!P.timer||!R.run)return;
  let ch=false;
  while(Date.now()>=R.end){
    if(R.phase==='work'){
      if(R.lvl>=P.niveles.length-1)return finishPir();
      if(P.rest>0){R.phase='rest';R.end+=P.rest*1000;R.total=P.rest}else{R.lvl++;R.end+=P.work*1000;R.total=P.work}}
    else{R.phase='work';R.lvl++;R.end+=P.work*1000;R.total=P.work}
    ch=true}
  R.left=Math.ceil((R.end-Date.now())/1000);
  if(ch){beepChange();drawRun()}
  else{if(R.left!==R.lastLeft&&R.left<=3&&R.left>0)beepTick();setRing(R.left,R.total)}
  R.lastLeft=R.left}
function finishPir(){
  const sec=sSec(),P=D.pir,reps=P.niveles.reduce((a,b)=>a+b,0);
  const id=addHist('pir',R.combo.n,sec,{niv:P.niveles.length,reps});beepFinish();
  drawSummary({id,sec,sub:'Pirámide completada',rows:[['Tiempo',fmtMS(sec)],['Niveles',P.niveles.length],['Reps',reps]],again:'pirChoose()'})}

// ============================================================ VISTA: PROGRESO
function viewProg(){
  return `<div class="head"><div class="eyebrow">Tu evolución</div><h1>Progreso</h1></div>
  <div class="seg"><button class="${V.sub==='resumen'?'on':''}" onclick="V.sub='resumen';render()">Resumen</button><button class="${V.sub==='hist'?'on':''}" onclick="V.sub='hist';render()">Historial</button></div>
  ${V.sub==='hist'?histView():statsView()}`}
function spark(v){
  const w=100,h=28,mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;
  return `<svg viewBox="0 0 ${w} ${h}"><polyline points="${v.map((x,i)=>(i/(v.length-1)*w).toFixed(1)+','+(h-3-(x-mn)/rg*(h-6)).toFixed(1)).join(' ')}"/></svg>`}
function statsView(){
  if(!D.hist.length)return `<div class="empty">Todavía no hay entrenamientos<br>Completá uno y acá vas a ver tu progreso</div>`;
  const per=V.per,cut=per==='7'?Date.now()-7*864e5:per==='30'?Date.now()-30*864e5:0;
  const H=D.hist.filter(e=>e.ts>=cut),tot=H.reduce((a,e)=>a+esec(e),0),st=streaks();
  // últimas 8 semanas (minutos)
  const mon=mondayOf(new Date());
  const wk=[...Array(8)].map((_,k)=>{const s=new Date(mon);s.setDate(s.getDate()-7*(7-k));const e=new Date(s);e.setDate(e.getDate()+7);
    const min=Math.round(D.hist.filter(x=>x.ts>=s.getTime()&&x.ts<e.getTime()).reduce((a,x)=>a+esec(x),0)/60);
    return{min,l:s.getDate()+'/'+(s.getMonth()+1)}});
  const mxw=Math.max(...wk.map(x=>x.min),1);
  // por tipo
  const tipos=['hiit','cal','pir'].map(t=>{const a=H.filter(e=>e.tipo===t);return{t,n:a.length,s:a.reduce((p,e)=>p+esec(e),0)}});
  const mxt=Math.max(...tipos.map(x=>x.n),1);
  // últimos 14 días
  const set=new Set(D.hist.map(e=>dayNum(e.ts)));
  const dots=[...Array(14)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-(13-k));return{on:set.has(dayNum(d.getTime())),l:d.toLocaleDateString('es-AR',{weekday:'narrow'}).toUpperCase()}});
  // progreso calistenia
  const map={};D.hist.filter(e=>e.tipo==='cal'&&e.ej).sort((a,b)=>a.ts-b.ts).forEach(e=>e.ej.forEach(x=>{(map[x.n]=map[x.n]||[]).push(x.r.reduce((a,b)=>a+b,0))}));
  const prog=Object.entries(map).sort((a,b)=>b[1].length-a[1].length).slice(0,8);
  const ins=insights(),oc=H2(D.hist);
  return `<div class="grp-t">Análisis</div><div class="grp">${ins.map(i=>`<div class="li ins"><div class="ins-ic ${i.l}">${i.l==='good'?'✓':i.l==='warn'?'!':'i'}</div><div class="sp"><div class="ins-t">${esc(i.t)}</div><div class="ins-d">${esc(i.d)}</div></div></div>`).join('')}</div>
  <div class="seg" style="margin-top:1.2rem">${[['7','7 días'],['30','30 días'],['all','Todo']].map(p=>`<button class="${per===p[0]?'on':''}" onclick="V.per='${p[0]}';render()">${p[1]}</button>`).join('')}</div>
  <div class="kpis"><div class="kpi"><b>${H.length}</b><small>Entrenamientos</small></div><div class="kpi"><b>${fmtLong(tot)}</b><small>Tiempo total</small></div>
    <div class="kpi"><b>${st.cur}</b><small>Racha actual</small></div><div class="kpi"><b>${st.best}</b><small>Mejor racha</small></div></div>
  <div class="grp-t">Minutos por semana</div>
  <div class="card"><div class="chart">${wk.map(w=>`<div class="b">${w.min?`<em>${w.min}</em>`:''}<i class="${w.min?'':'z'}" style="height:${w.min?Math.max(4,w.min/mxw*78):3}%"></i></div>`).join('')}</div>
    <div class="chart-l">${wk.map(w=>`<span>${w.l}</span>`).join('')}</div></div>
  <div class="grp-t">Por tipo</div>
  <div class="card">${tipos.map(x=>`<div class="tbar ${TIPO[x.t].c}"><div class="tbar-h"><span>${TIPO[x.t].n}</span><span>${x.n} · ${fmtLong(x.s)}</span></div><div class="bar"><i style="width:${x.n/mxt*100}%"></i></div></div>`).join('')}</div>
  <div class="grp-t">Últimos 14 días</div>
  <div class="card"><div class="dots">${dots.map(d=>`<div><i class="${d.on?'on':''}"></i>${d.l}</div>`).join('')}</div></div>
  ${oc.length?pulseView(oc):''}
  ${prog.length?`<div class="grp-t">Calistenia · repeticiones por sesión</div><div class="grp">${prog.map(([n,v])=>{const last=v[v.length-1],prev=v.length>1?v[v.length-2]:null,dl=prev===null?null:last-prev;
    return `<div class="li"><div class="sp"><div class="li-t">${esc(n)}</div><div class="li-s">Última: ${last} reps · ${v.length} ${v.length===1?'sesión':'sesiones'}</div></div><div class="prog">${v.length>1?spark(v.slice(-8)):''}<span class="delta ${dl===null||dl===0?'eq':dl>0?'up':'dn'}">${dl===null?'—':dl>0?'+'+dl:dl}</span></div></div>`}).join('')}</div>`:''}`}
function histView(){
  const a=[...D.hist].sort((x,y)=>y.ts-x.ts);
  if(!a.length)return `<div class="empty">Todavía no hay entrenamientos<br>Completá uno y aparece acá</div>`;
  let h='',last='',open=false;
  a.forEach(e=>{const k=dayNum(e.ts);

    const di=dc.indexOf(Math.max(...dc)),tt=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0][0];
    out.push({l:'info',t:`Tu momento fuerte: ${dn[di]} por la ${tt}`,d:'Es cuando más entrenaste hasta ahora. Anclar el hábito a un horario ayuda a sostenerlo.'})}
  // datos de capturas (pulso y calorías)
  const oc=H2(H),maxHR=D.set.age?220-D.set.age:0;
  if(!oc.length)out.push({l:'info',t:'Sumá capturas de tu reloj',d:'Si agregás una captura a un entrenamiento (📷), analizo tu pulso, calorías y cómo evoluciona tu esfuerzo.'});
  else{
    const hr=oc.filter(e=>e.ocr.hrAvg),lastHr=hr[hr.length-1];
    if(lastHr){const a=lastHr.ocr.hrAvg;
      if(maxHR){const pc=Math.round(a/maxHR*100),z=pc<60?'suave (recuperación)':pc<70?'aeróbica base (quema de grasa)':pc<80?'aeróbica moderada':pc<90?'alta intensidad':'máxima';
        out.push({l:pc>=90?'warn':'info',t:`Última sesión con pulso: ${a} bpm (${pc}% de tu máximo)`,d:`Zona ${z}, tomando un máximo estimado de ${maxHR} bpm (220 − edad).`})}
      else out.push({l:'info',t:`Última sesión con pulso: ${a} bpm de promedio`,d:'Cargá tu edad en Ajustes y te digo en qué zona de intensidad entrenaste.'})}
    const hh=hr.filter(e=>e.tipo==='hiit');
    if(hh.length>=4){const k=Math.min(3,Math.floor(hh.length/2)),L=avgOf(hh.slice(-k).map(e=>e.ocr.hrAvg)),P=avgOf(hh.slice(-2*k,-k).map(e=>e.ocr.hrAvg)),df=Math.round(L-P);
      if(df<=-3)out.push({l:'good',t:`Tu pulso promedio en HIIT bajó ${-df} bpm`,d:`De ${Math.round(P)} a ${Math.round(L)} bpm con la misma rutina: suele indicar mejor condición cardiovascular.`});
      else if(df>=5)out.push({l:'warn',t:`Tu pulso promedio en HIIT subió ${df} bpm`,d:`De ${Math.round(P)} a ${Math.round(L)} bpm. Puede ser más intensidad, pero también fatiga, poco descanso o estrés: mirá cómo dormís y recuperás.`});
      else out.push({l:'info',t:'Pulso estable en HIIT',d:`Alrededor de ${Math.round(L)} bpm de promedio en tus últimas sesiones.`})}
    const ef=oc.filter(e=>e.ocr.kcal&&(e.ocr.dur||esec(e))).map(e=>e.ocr.kcal/((e.ocr.dur||esec(e))/60));
    if(ef.length>=4){const k=Math.min(3,Math.floor(ef.length/2)),L=avgOf(ef.slice(-k)),P=avgOf(ef.slice(-2*k,-k)),pc=Math.round((L/P-1)*100);
      if(pc>=10)out.push({l:'good',t:`Gastás ${pc}% más calorías por minuto`,d:`${L.toFixed(1).replace('.',',')} kcal/min contra ${P.toFixed(1).replace('.',',')} antes: estás entrenando con más intensidad.`});
      else if(pc<=-10)out.push({l:'info',t:`Bajó tu gasto por minuto (${pc}%)`,d:`${L.toFixed(1).replace('.',',')} kcal/min contra ${P.toFixed(1).replace('.',',')} antes. Puede ser una sesión más suave o menos ritmo.`})}
    const mxo=Math.max(...hr.map(e=>e.ocr.hrMax||0));
    if(maxHR&&mxo>maxHR+5)out.push({l:'info',t:`Tu pulso máximo registrado (${mxo}) supera el estimado (${maxHR})`,d:'La fórmula 220 − edad es aproximada: tu máximo real puede ser más alto. Tomá el registrado como referencia.'})}
  const ord={warn:0,good:1,info:2};
  return out.map((x,i)=>({x,i})).sort((a,b)=>ord[a.x.l]-ord[b.x.l]||a.i-b.i).map(o=>o.x).slice(0,9)}
function pulseView(oc){
  const hr=oc.filter(e=>e.ocr.hrAvg),kc=oc.filter(e=>e.ocr.kcal),mx=Math.max(0,...oc.map(e=>e.ocr.hrMax||0));
  return `<div class="grp-t">Pulso y calorías · desde tus capturas</div>
  <div class="kpis" style="margin-top:0"><div class="kpi"><b>${oc.length}</b><small>Sesiones con datos</small></div>
    <div class="kpi"><b>${hr.length?Math.round(avgOf(hr.map(e=>e.ocr.hrAvg))):'—'}</b><small>Pulso promedio (bpm)</small></div>
    <div class="kpi"><b>${kc.length?Math.round(avgOf(kc.map(e=>e.ocr.kcal))):'—'}</b><small>Kcal por sesión</small></div>
    <div class="kpi"><b>${mx||'—'}</b><small>Pulso máximo (bpm)</small></div></div>
  ${hr.length>1?`<div class="grp" style="margin-top:.6rem"><div class="li"><div class="sp"><div class="li-t">Pulso promedio</div><div class="li-s">Últimas ${Math.min(10,hr.length)} sesiones</div></div><div class="prog">${spark(hr.slice(-10).map(e=>e.ocr.hrAvg))}</div></div>
  ${kc.length>1?`<div class="li"><div class="sp"><div class="li-t">Calorías</div><div class="li-s">Últimas ${Math.min(10,kc.length)} sesiones</div></div><div class="prog">${spark(kc.slice(-10).map(e=>e.ocr.kcal))}</div></div>`:''}</div>`:''}`}

// ============================================================ VISTA: AJUSTES
function viewAjustes(){
  const s=D.set,sw=(k)=>`<button class="sw ${s[k]?'on':''}" onclick="toggleSet('${k}')" aria-label="${k}"></button>`;
  const seg=(k,opts)=>`<div class="seg">${opts.map(o=>`<button class="${s[k]===o[0]?'on':''}" onclick="setPref('${k}','${o[0]}')">${o[1]}</button>`).join('')}</div>`;
  return `<div class="head"><div class="eyebrow">Preferencias</div><h1>Ajustes</h1></div>
  <div class="grp-t">Apariencia</div>
  <div class="card">${seg('theme',[['auto','Automático'],['light','Claro'],['dark','Oscuro']])}
    <span class="lbl">Tamaño de letra</span>${seg('fs',[['s','Chico'],['n','Normal'],['l','Grande'],['xl','Extra']])}
    <p style="margin-top:.8rem;color:var(--mu)">Así se ve el texto con este tamaño.</p></div>
  <div class="grp-t">Entrenamiento</div>
  <div class="grp"><div class="li"><div class="sp"><div class="li-t">Sonido</div><div class="li-s">Beeps al cambiar de fase</div></div>${sw('sound')}</div>
    <div class="li"><div class="sp"><div class="li-t">Vibración</div><div class="li-s">Si tu celular lo permite</div></div>${sw('vibrate')}</div>
    <div class="li"><div class="sp"><div class="li-t">Mantener pantalla encendida</div><div class="li-s">Durante el entrenamiento</div></div>${sw('wake')}</div></div>
  <div class="grp-t">Tu perfil</div>
  <div class="grp"><div class="li"><div class="sp"><div class="li-t">Edad</div><div class="li-s">Opcional · para estimar tu pulso máximo</div></div><input type="number" inputmode="numeric" style="width:5rem;text-align:center" value="${s.age||''}" placeholder="—" onchange="setAge(this.value)"></div></div>
  <div class="grp-t">Tus datos</div>
  <div class="grp"><div class="li" onclick="exportData()"><div class="sp"><div class="li-t">Exportar copia de seguridad</div><div class="li-s">Historial y rutinas en un archivo</div></div>›</div>
    <label class="li" style="cursor:pointer"><div class="sp"><div class="li-t">Importar copia</div><div class="li-s">Restaura desde un archivo</div></div>›<input type="file" accept="application/json,.json" class="hidden" onchange="importData(this)"></label>
    <div class="li" onclick="clearHist()"><div class="sp"><div class="li-t" style="color:var(--red)">Borrar historial</div><div class="li-s">${D.hist.length} entrenamientos guardados</div></div></div></div>
  <p class="note">Todo se guarda en este celular. Si desinstalás la app o borrás los datos del navegador se pierde: exportá una copia de vez en cuando.</p>
  ${isStandalone()?'':`<div class="grp-t">App</div><div class="card">${deferredInstall?`<button class="btn pri big" style="margin-top:0" onclick="installApp()">⬇ Instalar app</button>`:`<p class="li-s">${/iphone|ipad|ipod/i.test(navigator.userAgent)?'Para instalar: tocá Compartir y elegí “Agregar a inicio”.':/android/i.test(navigator.userAgent)?'Para instalar: abrí esta página en Chrome → menú ⋮ → “Instalar app”.':'Instalala desde el menú de tu navegador.'}</p>`}</div>`}`}
function setAge(v){const n=parseInt(v);D.set.age=(n>=10&&n<=100)?n:0;save()}
function setPref(k,v){D.set[k]=v;save();applyTheme();render()}
function toggleSet(k){D.set[k]=!D.set[k];save();if(k==='sound'&&D.set.sound)beep(660,100);render()}
function exportData(){
  const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='kombat-copia-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Copia exportada')}
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||j.v!==2)throw 0;
    if(!confirm('Esto reemplaza tu historial y tus rutinas actuales. ¿Continuar?'))return;
    D=normalize(j);save();applyTheme();render();toast('Copia restaurada')}catch(e){toast('Archivo inválido')}};
  r.readAsText(f);inp.value=''}
function clearHist(){if(!D.hist.length)return;if(!confirm('¿Borrar TODO el historial? No se puede deshacer.'))return;D.hist=[];save();render();toast('Historial borrado')}

// ============================================================ INICIO
applyTheme();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
