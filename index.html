<style>
:root{--bg:#faf8f3;--card:#fff;--tx:#1d1b16;--mu:#8b8575;--bd:#ece6d6;--pri:#946d18;--pri2:#f7f1e1;--gf1:#d4b05a;--gf2:#b98b2e;--ok:#4f7d4b;--bad:#a8473b;--warn:#b2692d;--top:#fff;--topx:#1d1b16;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif}

input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}

.chip.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}.chip.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.bar{height:3px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gf1),var(--gf2));border-radius:9px;transition:width .3s}

.modal>div{background:var(--card);border-top:1px solid var(--pri);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 13px}
.pills button{padding:7px 14px;border-radius:99px;font-size:0.8125rem}
.pills button.on{background:linear-gradient(180deg,var(--gf1),var(--gf2));color:#1a1406;border-color:var(--gf2);font-weight:600}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;letter-spacing:0}.opt b{display:block;font:600 1.25rem/1.2 var(--serif)}.opt span{font-size:0.8438rem;color:var(--mu);font-weight:400}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:30;font-size:0.875rem;font-weight:500;letter-spacing:.02em;max-width:90vw}
.login{min-height:100vh;display:flex;align-items:center}.login .card{width:100%;padding:30px 24px}
.login h1{font-size:2.625rem;letter-spacing:.02em}
.logo{width:56px;height:56px;border-radius:12px;margin:0 auto 14px;display:block}
.center{text-align:center}
.code{font:600 1.875rem/1 var(--serif);letter-spacing:.35em;color:var(--pri);margin:12px 0}
.inst{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--card);border:1px solid var(--pri);border-radius:12px;padding:14px;z-index:15;box-shadow:0 10px 32px rgba(0,0,0,.25)}
.inst.top2{bottom:auto;top:12px}.inst img{width:38px;height:38px;border-radius:9px}
.step{display:flex;gap:10px;align-items:center;font-size:0.9688rem;margin:7px 0;color:var(--tx);font-weight:400;text-transform:none;letter-spacing:0}
.step input{-webkit-appearance:none;appearance:none;width:19px;height:19px;margin:0;flex:none;border:1px solid color-mix(in srgb,var(--pri) 55%,var(--bd));border-radius:4px;background:transparent;display:grid;place-items:center}
.step input:checked{background:linear-gradient(180deg,var(--gf1),var(--gf2));border-color:var(--gf2)}
.step input:checked::after{content:"";width:8px;height:4px;border-left:1.6px solid #1a1406;border-bottom:1.6px solid #1a1406;transform:rotate(-45deg) translate(1px,-1px)}
.big,.tbar .tbt,.ld span,.code,.top b,h1,h3,.opt b{font-variant-numeric:lining-nums;font-feature-settings:"lnum"}.step.on{color:var(--mu);text-decoration:line-through}
.msg{background:var(--pri2);border-color:color-mix(in srgb,var(--pri) 35%,transparent)}
.msg b{display:block;font-size:0.6562rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pri);font-weight:500;margin-bottom:3px}
.tbar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:#0b0b0c;color:#ece6d6;border:1px solid #3a3222;border-radius:12px;padding:11px 14px;z-index:12;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tbar.brk{background:linear-gradient(180deg,var(--gf1),var(--gf2));color:#1a1406;border-color:var(--gf2)}
.tbar .tbl{font-size:0.6562rem;letter-spacing:.16em;text-transform:uppercase;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .tbt{font:500 2.375rem/1.05 var(--serif);letter-spacing:.02em;color:#dcb966}
.tbar.brk .tbt{color:#1a1406}
.tbar button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:inherit}
.tbar.brk button{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.2)}
.tbar button.pri{background:linear-gradient(180deg,#dfbc69,#c0973f);border-color:#c0973f;color:#1a1406}
.tbar.brk button.pri{background:#0b0b0c;color:#dcb966;border-color:#0b0b0c}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wks{display:flex;gap:6px;margin-top:11px}.wk{flex:1;text-align:center;padding:7px 0;border-radius:6px;font-size:0.8125rem;font-weight:500;background:var(--bd);color:var(--mu)}
.wk.ok{background:linear-gradient(180deg,var(--gf1),var(--gf2));color:#1a1406}.wk.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}.wk.cur{background:var(--pri2);color:var(--pri)}.wk.na{opacity:.35}
.ld{display:flex;gap:8px;align-items:flex-end;height:104px}
.ld div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.ld span{font:600 1.25rem/1 var(--serif)}.ld small{font-size:0.6562rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:500}
.ld b{display:block;width:100%;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--gf1),var(--gf2))}.ld b.hi{background:var(--warn)}
</style>

<body>
<div id="app"></div>
<script>
const SB='https://ymfnnoksuccktjakymnb.supabase.co';
const KEY='sb_publishable_zqG5YidGNfYQGTCfi3-yxg_p1gls28j';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const dt=s=>new Date(s+'T12:00:00');
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return fmt(d)};
const dow=s=>dt(s).getDay();
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const longD=s=>dt(s).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

async function rpc(fn,args){
  const r=await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||'Error de conexión');
  return j;
}
let S={code:null,pin:null,role:null,name:'',cfg:{tasks:[],blocks:[]},ev:[],tab:'hoy',day:today()};
const boss=()=>S.role==='boss';
function apply(r){S.role=r.role;S.code=r.code;S.name=r.name;S.cfg=Object.assign({tasks:[],blocks:[]},r.config||{});S.cfg.tasks=S.cfg.tasks||[];S.cfg.blocks=S.cfg.blocks||[];S.ev=r.events||[];ls.set('jr_cache',r)}
async function refresh(){if(!S.code)return;try{apply(await rpc('jr_login',{p_code:S.code,p_pin:S.pin}));return true}catch(e){return false}}
async function login(code,pin){
  try{const r=await rpc('jr_login',{p_code:code,p_pin:pin});S.pin=pin;apply(r);ls.set('jr_auth',{code:r.code,pin});S.tab='hoy';S.day=today();render();checkPush()}
  catch(e){toast(e.message)}
}
async function create(){
  const n=$('#cn').value.trim(),bp=$('#cb').value.trim(),sp=$('#cs').value.trim();
  if(!n)return toast('Pon el nombre de tu compañera');
  try{const code=await rpc('jr_create',{p_name:n,p_boss_pin:bp,p_staff_pin:sp});
    await login(code,bp);
    modal(`<div class="center"><h3>Equipo creado</h3><p class="mute">Este es el código del equipo. Ella entra con el código y su PIN; tú con el código y el tuyo.</p><div class="code">${code}</div><button class="pri" style="width:100%" onclick="closeModal()">Empezar</button></div>`)
  }catch(e){toast(e.message)}
}
function logout(){TM=null;ls.set('jr_timer',null);document.querySelector('.tbar')?.remove();document.body.classList.remove('hastm');ls.set('jr_auth',null);ls.set('jr_cache',null);S={code:null,pin:null,role:null,name:'',cfg:{tasks:[],blocks:[]},ev:[],tab:'hoy',day:today()};render()}

// ---------- lógica de tareas ----------
function status(id,d){let s=null;for(const e of S.ev)if(e.task===id&&e.d===d&&(e.type==='done'||e.type==='undone'))s=e;return s&&s.type==='done'?s:null}
function doneAny(id){const m={};for(const e of S.ev)if(e.task===id&&(e.type==='done'||e.type==='undone'))m[e.d]=e.type;return Object.values(m).includes('done')}
function tasksOn(d){
  const t=today();
  return S.cfg.tasks.filter(k=>{
    if(k.kind==='semanal')return false;
    if(k.arch&&d>=k.arch)return false;
    if(d<(k.from||'0000'))return false;
    if(k.kind==='puntual')return d===k.date||(d===t&&k.date<t&&!doneAny(k.id));
    return (k.days||[]).includes(dow(d));
  }).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
}
function isLate(k,d){if(status(k.id,d))return false;const t=today();if(d<t)return true;if(d===t&&k.time&&nowHM()>k.time)return true;return k.kind==='puntual'&&k.date<d}
// Las semanales cuentan el día en que se terminan; el domingo se suman como pendientes las que faltaron para cumplir la semana.
function weeklyDay(d){let n=0,t=0;const last=addD(wkStart(d),6)===d;
  weeklyOn(d).forEach(k=>{const dn=S.ev.filter(x=>x.type==='done'&&x.task===k.id&&x.d===d).length;n+=dn;t+=dn;if(last)t+=Math.max(0,(k.times||1)-wkCount(k,d))});
  return{n,t}}
function dayStat(d){const r=tasksOn(d),w=weeklyDay(d),n=r.filter(k=>status(k.id,d)).length+w.n,total=r.length+w.t;return{n,total,pct:total?Math.round(n/total*100):null}}
const wkStart=d=>addD(d,-((dow(d)+6)%7));
const wkDates=d=>{const s=wkStart(d);return [0,1,2,3,4,5,6].map(i=>addD(s,i))};
function weeklyOn(d){const e=addD(wkStart(d),6);return S.cfg.tasks.filter(k=>k.kind==='semanal'&&e>=(k.from||'0000')&&!(k.arch&&e>=k.arch))}
const wkCount=(k,d)=>{const w=wkDates(d);return S.ev.filter(e=>e.type==='done'&&e.task===k.id&&w.includes(e.d)).length};
const wkTime=(k,d)=>wkDates(d).reduce((a,x)=>a+timeOn(k.id,x),0);
function streak(){let s=0,d=today();const st=dayStat(d);if(st.total&&st.n<st.total)d=addD(d,-1);
  for(let i=0;i<120;i++){const x=dayStat(d);if(!x.total){d=addD(d,-1);continue}if(x.n===x.total){s++;d=addD(d,-1)}else break}return s}
function bestStreak(){let b=0,c=0;for(let i=119;i>=0;i--){const d=addD(today(),-i),x=dayStat(d);if(!x.total)continue;if(x.n===x.total){c++;b=Math.max(b,c)}else if(d<today())c=0}return b}
function range(n){let a=0,b=0;for(let i=0;i<n;i++){const x=dayStat(addD(today(),-i));a+=x.n;b+=x.total}return b?Math.round(a/b*100):null}
const notesFor=(id,d)=>S.ev.filter(e=>e.task===id&&e.d===d&&(e.type==='comment'||(e.type==='note'&&!e.kind&&e.text)));
// tiempo: se guarda dentro de eventos permitidos a la compañera ('done' con sec, o 'note' con kind:'time')
const recs=()=>S.ev.filter(e=>((e.type==='done'&&e.sec>0)||(e.type==='note'&&e.kind==='time'))&&e.task&&e.d);
const timeOn=(id,d)=>recs().reduce((a,e)=>a+(e.task===id&&e.d===d?e.sec:0),0);
const focusOn=d=>recs().reduce((a,e)=>a+(e.d===d?e.sec:0),0);
function activeNow(id,d){if(d!==today())return false;let l=null;for(const e of S.ev)if(e.task===id&&e.d===d&&((e.type==='note'&&(e.kind==='tstart'||e.kind==='time'))||(e.type==='done')))l=e;return !!l&&l.kind==='tstart'&&(!l.at||Date.now()-new Date(l.at)<4*36e5)}
const subOn=(id,d,i)=>{let v=false;for(const e of S.ev)if(e.type==='note'&&e.kind==='sub'&&e.task===id&&e.d===d&&e.i===i)v=!!e.on;return v};

async function send(e){
  S.ev.push({...e,by:S.role,id:Date.now()+Math.random()});render();
  try{await rpc('jr_event',{p_code:S.code,p_pin:S.pin,p_ev:e});await refresh()}catch(x){toast(x.message)}render();
}
async function toggleSub(id,i){
  const d=S.day;if(d!==today()||boss())return;
  await send({type:'note',kind:'sub',task:id,d,i,on:!subOn(id,d,i)});
}
function markDone(id){closeModal();send({type:'done',task:id,d:today(),tm:nowHM()});toast('Tarea terminada')}

function heat(){

  <div class="mute" style="margin-top:8px">Tareas con día fijo y puntuales de esta semana. En naranja, los días más cargados.${sem.length?` Además hay ${sem.length} semanal${sem.length===1?'':'es'} sin día fijo.`:''}</div></div>
  ${cols.map(c=>`<div class="bh"><b>${full[c.i]}${hi(c)?' · carga alta':''}</b><span class="mute">${c.l.length} ${c.l.length===1?'tarea':'tareas'}${c.est>0?' · ~'+fmtMin(c.est):''}</span></div>${c.l.length?c.l.map(k=>taskLine(k,true)).join(''):'<div class="card mute center">Sin tareas</div>'}`).join('')}
  ${sem.length?`<div class="bh"><b>Semanales (cualquier día)</b></div>${sem.map(k=>taskLine(k,true)).join('')}`:''}
  ${others.length?`<div class="bh"><b>Puntuales en otras fechas</b></div>${others.map(k=>taskLine(k,true)).join('')}`:''}
  <div class="mute center" style="margin-top:4px">~ = tiempo estimado según lo que ella tardó en esas tareas.</div>`;
}
function viewTareas(){
  const ts=S.cfg.tasks.filter(k=>!k.arch),bl=S.cfg.blocks||[];
  return `<div class="head"><h1>Tareas</h1><div class="row"><button onclick="blockModal()">+ Bloque</button><button class="pri" onclick="taskModal()">+ Tarea</button></div></div>
  <div class="pills" style="margin-top:-4px"><button class="${TV==='bloque'?'on':''}" onclick="setTV('bloque')">Por bloque</button><button class="${TV==='dia'?'on':''}" onclick="setTV('dia')">Por día de la semana</button></div>
  ${!ts.length&&!bl.length?'<div class="card mute">Aquí armas todo tú. Crea <b>bloques</b> (por ejemplo "Mañana" o "Atención a clientes") y dentro agrega <b>tareas</b>, cada una con sus <b>subtareas</b> si lo necesitas.</div>':''}
  ${TV==='dia'?dayView(ts):blockView(ts,bl)}`;
}
let TF={};
function blockModal(id){const b=(S.cfg.blocks||[]).find(x=>x.id===id);
  modal(`<h3>${b?'Editar bloque':'Nuevo bloque'}</h3><label>Nombre</label><input id="bn" value="${esc(b?b.name:'')}" placeholder="Ej: Mañana, Atención a clientes, Administración"><button class="pri" style="width:100%" onclick="saveBlock('${id||''}')">Guardar</button>${b?`<p class="center"><button class="ghost danger" onclick="delBlock('${id}')">Eliminar bloque</button></p><p class="mute center">Las tareas del bloque no se borran: pasan a "Sin bloque".</p>`:''}`)}
function saveBlock(id){const n=$('#bn').value.trim();if(!n)return toast('Ponle un nombre');S.cfg.blocks=S.cfg.blocks||[];if(id){S.cfg.blocks.find(x=>x.id===id).name=n}else S.cfg.blocks.push({id:uid(),name:n});closeModal();saveCfg()}
function delBlock(id){if(!confirm('¿Eliminar este bloque?'))return;S.cfg.blocks=S.cfg.blocks.filter(x=>x.id!==id);S.cfg.tasks.forEach(k=>{if(k.block===id)k.block=''});closeModal();saveCfg()}
function taskModal(id){
  const k=S.cfg.tasks.find(x=>x.id===id);
  TF=k?{...k,days:[...(k.days||[])],steps:[...(k.steps||[])]}:{id:null,title:'',desc:'',kind:'fija',days:[1,2,3,4,5],date:today(),time:'',essential:false,steps:[],block:'',times:1};
  drawTask();
}
function syncTF(){const g=i=>document.getElementById(i);if(!g('tt'))return;TF.title=g('tt').value;TF.desc=g('td').value;TF.time=g('tm')?g('tm').value:'';if(g('tw'))TF.times=+g('tw').value;TF.essential=g('te').checked;TF.block=g('tb').value;TF.steps=g('ts').value.split('\n').map(x=>x.trim()).filter(Boolean);if(g('tdate'))TF.date=g('tdate').value}
function drawTask(){
  const bl=S.cfg.blocks||[];
  modal(`<h3>${TF.id?'Editar tarea':'Nueva tarea'}</h3>
  <label>Tarea</label><input id="tt" value="${esc(TF.title)}" placeholder="Ej: Responder consultas de clientes">
  <label>Detalle (opcional)</label><input id="td" value="${esc(TF.desc)}">
  <label>Bloque</label><select id="tb"><option value="">Sin bloque</option>${bl.map(b=>`<option value="${b.id}" ${TF.block===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
  <label>Subtareas (opcional, una por línea)</label><textarea id="ts" rows="3" placeholder="Ej: Revisar la bandeja de entrada">${esc((TF.steps||[]).join('\n'))}</textarea>
  <label>Tipo</label><div class="pills"><button class="${TF.kind==='fija'?'on':''}" onclick="syncTF();TF.kind='fija';drawTask()">Se repite</button><button class="${TF.kind==='puntual'?'on':''}" onclick="syncTF();TF.kind='puntual';drawTask()">Puntual</button><button class="${TF.kind==='semanal'?'on':''}" onclick="syncTF();TF.kind='semanal';drawTask()">Semanal</button></div>
  ${TF.kind==='fija'?`<label>Días</label><div class="pills">${[1,2,3,4,5,6,0].map(x=>`<button class="${TF.days.includes(x)?'on':''}" onclick="syncTF();TF.days=TF.days.includes(${x})?TF.days.filter(y=>y!==${x}):[...TF.days,${x}];drawTask()">${DN[x]}</button>`).join('')}</div>`:TF.kind==='semanal'?`<label>Veces por semana</label><select id="tw">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${(TF.times||1)===n?'selected':''}>${n}</option>`).join('')}</select><p class="mute" style="margin:-6px 0 12px">Se hace en cualquier día de la semana (lun-dom). Ella la ve toda la semana hasta completarla.</p>`:`<label>Fecha</label><input id="tdate" type="date" value="${TF.date}">`}
  ${TF.kind==='semanal'?'':`<label>Hora límite (opcional)</label><input id="tm" type="time" value="${TF.time||''}">`}
  <label class="row" style="color:var(--tx);text-transform:none;font-size:0.9062rem;letter-spacing:0"><input id="te" type="checkbox" style="width:auto;margin:0" ${TF.essential?'checked':''}> Prioritaria</label><p></p>
  <button class="pri" style="width:100%" onclick="saveTask()">Guardar</button>
  ${TF.id?`<p class="center"><button class="ghost danger" onclick="delTask()">Eliminar tarea</button></p>`:''}`);
}
function saveTask(){
  syncTF();if(!TF.title.trim())return toast('Ponle un nombre');
  if(TF.kind==='fija'&&!TF.days.length)return toast('Elige al menos un día');
  const o={id:TF.id||uid(),title:TF.title.trim(),desc:TF.desc.trim(),kind:TF.kind,days:TF.kind==='fija'?TF.days:[],date:TF.kind==='puntual'?TF.date:null,time:TF.kind==='semanal'?'':(TF.time||''),times:TF.kind==='semanal'?(TF.times||1):null,essential:TF.essential,steps:TF.steps||[],block:TF.block||'',from:TF.from||today()};
  const i=S.cfg.tasks.findIndex(x=>x.id===o.id);if(i>=0)S.cfg.tasks[i]=o;else S.cfg.tasks.push(o);
  closeModal();saveCfg();
}
function delTask(){if(!confirm('¿Eliminar esta tarea? El historial se mantiene.'))return;const k=S.cfg.tasks.find(x=>x.id===TF.id);if(k)k.arch=today();closeModal();saveCfg()}
function noteModal(id,d){
  const k=S.cfg.tasks.find(x=>x.id===id);
  modal(`<h3>${boss()?'Comentario para ella':'Nota'}</h3><p class="mute">${esc(k.title)}</p><textarea id="nt" rows="3" placeholder="${boss()?'Ej: Falta adjuntar el archivo':'Ej: Queda esperando respuesta del cliente'}"></textarea><button class="pri" style="width:100%" onclick="saveNote('${id}','${d}')">Enviar</button>`);
}
function saveNote(id,d){const v=$('#nt').value.trim();if(!v)return;closeModal();send({type:boss()?'comment':'note',task:id,d,text:v})}
function msgModal(){const m=S.cfg.msg||{};
  modal(`<h3>Mensaje para ${esc(S.name)}</h3><p class="mute">Lo verá arriba en "Hoy" durante ese día.</p><textarea id="mg" rows="3" placeholder="Ej: Hoy la prioridad es el reporte mensual">${esc(m.text||'')}</textarea><label>Para</label><div class="pills"><button id="m0" class="on" onclick="this.classList.add('on');$('#m1').classList.remove('on')">Hoy</button><button id="m1" onclick="this.classList.add('on');$('#m0').classList.remove('on')">Mañana</button></div><button class="pri" style="width:100%" onclick="saveMsg()">Publicar</button>${m.text?`<p class="center"><button class="ghost danger" onclick="S.cfg.msg=null;closeModal();saveCfg()">Quitar mensaje</button></p>`:''}`)}
function saveMsg(){const t=$('#mg').value.trim();if(!t)return;const d=$('#m1').classList.contains('on')?addD(today(),1):today();S.cfg.msg={text:t,date:d};closeModal();saveCfg();toast('Mensaje publicado')}

// ---------- temporizador / pomodoro ----------
const POMO={w:25*60,b:5*60,l:15*60};
let TM=ls.get('jr_timer',null),AC=null;
const fmtT=x=>{x=Math.max(0,Math.ceil(x));return pad(Math.floor(x/60))+':'+pad(x%60)};
const fmtMin=x=>{const m=Math.round(x/60);return m<1?(x>0?'<1 min':'0 min'):m>=60?Math.floor(m/60)+' h '+pad(m%60)+' min':m+' min'};
const tmEl=()=>TM.paused?TM.acc:TM.acc+(Date.now()-TM.t0)/1000;
const tmDur=()=>TM.mode==='free'?Infinity:TM.phase==='work'?POMO.w:(TM.pomos%4===0?POMO.l:POMO.b);
const tmFocus=()=>TM.focus+(TM.phase==='work'?tmEl():0);
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.15)})}catch{}}
function phaseAlert(){
  const m=TM.phase==='break'?(TM.pomos%4===0?'Pomodoro completo. Descanso largo de 15 min.':'Pomodoro completo. Descansa 5 min.'):'Fin del descanso. A enfocarse.';
  navigator.vibrate&&navigator.vibrate([200,100,200]);beep();toast(m);
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted')navigator.serviceWorker.ready.then(r=>r.showNotification('Jornada',{body:m,tag:'pomo',icon:'icon-192.png'})).catch(()=>{});
}
function tmTick(){
  if(!TM)return;let ch=false,g=0;
  while(!TM.paused&&tmEl()>=tmDur()&&g++<20){const left=tmEl()-tmDur();if(TM.phase==='work'){TM.focus+=POMO.w;TM.pomos++;TM.phase='break'}else TM.phase='work';TM.acc=left;TM.t0=Date.now();ch=true}
  if(ch){ls.set('jr_timer',TM);phaseAlert();tmBar()}
  const t=document.getElementById('tbt');if(t)t.textContent=TM.mode==='free'?fmtT(tmEl()):fmtT(tmDur()-tmEl());
}
function tmBar(){
  document.querySelector('.tbar')?.remove();document.body.classList.toggle('hastm',!!TM);if(!TM)return;
  const k=S.cfg.tasks.find(x=>x.id===TM.task)||{title:'Tarea'};
  const lab=TM.mode==='free'?'Cronómetro':(TM.phase==='work'?'Enfoque · Pomodoro '+(TM.pomos+1):'Descanso');
  const d=document.createElement('div');d.className='tbar'+(TM.phase==='break'?' brk':'');
  d.innerHTML=`<div class="sp"><div class="tbl">${lab} · ${esc(k.title)}</div><div class="tbt" id="tbt"></div></div><button onclick="tmPause()">${TM.paused?'Seguir':'Pausar'}</button><button class="pri" onclick="tmFinishModal()">Terminar</button>`;
  document.body.appendChild(d);tmTick();
}
function tmChoose(id){
  const k=S.cfg.tasks.find(x=>x.id===id);
  modal(`<h3>${esc(k.title)}</h3><p class="mute">Elige cómo trabajar esta tarea. Se registra cuánto tiempo le dedicas.</p>
  <button class="opt" onclick="tmStart('${id}','pomo')"><b>Pomodoro</b><span>25 min de enfoque + 5 de descanso, en ciclos</span></button>
  <button class="opt" onclick="tmStart('${id}','free')"><b>Cronómetro</b><span>Mide cuánto tardas, sin pausas automáticas</span></button>
  <p class="center"><button class="ghost" style="color:var(--mu)" onclick="markDone('${id}')">Ya la hice, sin cronómetro</button></p>`);
}
async function tmStart(id,mode){
  closeModal();
  if(TM&&TM.task!==id){if(!confirm('Ya tienes un temporizador en curso. ¿Guardar su tiempo y empezar este?'))return;await tmEnd(false,true)}
  if(TM)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch{}
  TM={task:id,d:today(),mode,phase:'work',t0:Date.now(),acc:0,paused:false,focus:0,pomos:0};ls.set('jr_timer',TM);
  tmBar();send({type:'note',kind:'tstart',task:id,d:TM.d,mode,tm:nowHM()});
}
function tmPause(){if(!TM)return;if(TM.paused){TM.t0=Date.now();TM.paused=false}else{TM.acc=tmEl();TM.paused=true}ls.set('jr_timer',TM);tmBar()}
function tmFinishModal(){
  if(!TM)return;const k=S.cfg.tasks.find(x=>x.id===TM.task)||{title:'Tarea'};
  modal(`<h3>${esc(k.title)}</h3><p class="mute">Tiempo de enfoque: <b>${fmtMin(tmFocus())}</b></p>
  <button class="opt" onclick="tmEnd(true)"><b>Terminar tarea</b><span>Queda completada con el tiempo registrado</span></button>
  <button class="opt" onclick="tmEnd(false)"><b>Guardar tiempo y dejarla pendiente</b><span>Sigue sin terminar para retomarla después</span></button>
  <p class="center"><button class="ghost" onclick="closeModal()">Seguir trabajando</button></p>`);
}
async function tmEnd(finish,quiet){
  closeModal();if(!TM)return;
  const t=TM,sec=Math.round(tmFocus());
  TM=null;ls.set('jr_timer',null);tmBar();
  if(finish){await send({type:'done',task:t.task,d:t.d,tm:nowHM(),sec,mode:t.mode,pomos:t.pomos});toast('Tarea terminada · '+fmtMin(sec))}
  else if(sec>=15){await send({type:'note',kind:'time',task:t.task,d:t.d,sec,mode:t.mode,pomos:t.pomos});if(!quiet)toast('Tiempo guardado · '+fmtMin(sec))}
  else render();
}
setInterval(tmTick,1000);

// ---------- avisos push (se muestran solo si el servidor los tiene habilitados) ----------
const b64u=v=>{const p='='.repeat((4-v.length%4)%4),r=atob((v+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
let PUSH=null,PAV=false;
async function checkPush(){
  if(!pushOK()||!S.code)return;
  try{await rpc('jr_vapid',{});PAV=true}catch{PAV=false;return}
  try{const r=await navigator.serviceWorker.ready;PUSH=!!(await r.pushManager.getSubscription())&&Notification.permission==='granted'}catch{PUSH=false}
  if(S.tab==='ajustes'&&!document.querySelector('.modal'))render();
}
async function enablePush(){
  try{
    if(Notification.permission==='denied')return toast('Los avisos están bloqueados en el navegador');
    if(await Notification.requestPermission()!=='granted')return;
    const reg=await navigator.serviceWorker.ready,key=await rpc('jr_vapid',{});
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    await rpc('jr_push_sub',{p_code:S.code,p_pin:S.pin,p_sub:sub.toJSON(),p_tz:Intl.DateTimeFormat().resolvedOptions().timeZone});
    PUSH=true;render();toast('Avisos activados');
  }catch(e){toast(e.message)}
}
async function disablePush(){try{const r=await navigator.serviceWorker.ready,s=await r.pushManager.getSubscription();if(s){await rpc('jr_push_off',{p_code:S.code,p_pin:S.pin,p_endpoint:s.endpoint});await s.unsubscribe()}PUSH=false;render();toast('Avisos desactivados')}catch(e){toast(e.message)}}
function pushCard(){
  if(!PAV)return '';
  let b;
  if(isIOS()&&!standalone())b=`<div class="mute">En iPhone, primero instala la app: Compartir → “Agregar a inicio”, y ábrela desde el ícono.</div>`;
  else b=PUSH?`<div class="mute" style="margin-bottom:8px">Activados en este dispositivo.</div><button style="width:100%" onclick="disablePush()">Desactivar avisos</button>`:`<div class="mute" style="margin-bottom:8px">${boss()?'Recibe un aviso si una tarea prioritaria no se hace a tiempo.':'Recibe un aviso cuando llega la hora de una tarea.'}</div><button class="pri" style="width:100%" onclick="enablePush()">Activar avisos</button>`;
  return `<div class="card"><label>Avisos</label><p style="margin:4px 0 8px"></p>${b}</div>`;
}

// ---------- ajustes ----------
function viewAjustes(){
  const th=ls.get('jr_theme','auto');
  return `<div class="head"><h1>Ajustes</h1></div>
  <div class="card"><label>Código del equipo</label><div class="code" style="margin:4px 0">${esc(S.code)}</div></div>
  <div class="card"><label>Tema</label><div class="pills">${[['auto','Auto'],['light','Claro'],['dark','Oscuro']].map(([v,n])=>`<button class="${th===v?'on':''}" onclick="setTheme('${v}')">${n}</button>`).join('')}</div></div>
  <div class="card"><label>Tamaño del texto</label><div class="pills">${[['n','Normal'],['l','Grande'],['xl','Muy grande']].map(([v,n])=>`<button class="${ls.get('jr_fs','n')===v?'on':''}" onclick="setFS('${v}')">${n}</button>`).join('')}</div></div>
  ${pushCard()}
  ${boss()?`<div class="card"><button style="width:100%;margin-bottom:8px" onclick="setVal('name','Nombre de tu compañera',false)">Cambiar nombre (${esc(S.name)})</button><button style="width:100%;margin-bottom:8px" onclick="setVal('staff','Nuevo PIN de ella',true)">Cambiar PIN de ella</button><button style="width:100%" onclick="setVal('boss','Tu nuevo PIN',true)">Cambiar tu PIN</button></div>`:''}
  <button class="danger" style="width:100%" onclick="logout()">Cerrar sesión</button>`;
}
function setVal(w,label,pin){modal(`<h3>${label}</h3><input id="sv" ${pin?'type="password" inputmode="numeric"':''}><button class="pri" style="width:100%" onclick="doSet('${w}')">Guardar</button>`)}
async function doSet(w){const v=$('#sv').value.trim();try{await rpc('jr_set',{p_code:S.code,p_pin:S.pin,p_what:w,p_val:v});if(w==='boss'){S.pin=v;ls.set('jr_auth',{code:S.code,pin:v})}closeModal();await refresh();render();toast('Listo')}catch(e){toast(e.message)}}

// ---------- instalación como app ----------
let DP=null;
const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBanner(){
  document.querySelector('.inst')?.remove();
  if(standalone()||ls.get('jr_inst_no',0)>Date.now())return;
  let body='';
  if(DP)body=`<button class="pri" style="width:100%" onclick="doInstall()">Instalar</button>`;
  else if(isIOS())body=`<div class="mute">Toca <b>Compartir</b> y luego <b>“Agregar a inicio”</b>.</div>`;
  else return;
  const d=document.createElement('div');d.className='inst'+(S.code?'':' top2');
  d.innerHTML=`<div class="row" style="margin-bottom:10px"><img src="icon.svg" alt=""><div class="sp"><b>Instala Jornada como app</b><div class="mute">Acceso directo y pantalla completa.</div></div></div>${body}<button class="ghost" style="width:100%;margin-top:4px" onclick="ls.set('jr_inst_no',Date.now()+6048e5);this.closest('.inst').remove()">Ahora no</button>`;
  document.body.appendChild(d);
}
async function doInstall(){if(!DP)return;DP.prompt();await DP.userChoice;DP=null;document.querySelector('.inst')?.remove()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;installBanner()});
window.addEventListener('appinstalled',()=>{DP=null;document.querySelector('.inst')?.remove()});

// ---------- render ----------
const IC={hoy:'<svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',hist:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>',tareas:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',ajustes:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>'};
function render(){
  applyTheme();const a=$('#app');
  if(!S.code){a.innerHTML=viewLogin();return}
  const tabs=boss()?[['hoy',IC.hoy,'Hoy'],['hist',IC.hist,'Estadísticas'],['tareas',IC.tareas,'Tareas'],['ajustes',IC.ajustes,'Ajustes']]:[['hoy',IC.hoy,'Hoy'],['hist',IC.hist,'Estadísticas'],['ajustes',IC.ajustes,'Ajustes']];
  if(!tabs.some(t=>t[0]===S.tab))S.tab='hoy';
  const v={hoy:viewHoy,hist:viewStats,tareas:viewTareas,ajustes:viewAjustes}[S.tab]();
  a.innerHTML=`<header class="top"><img src="icon.svg" alt=""><b>Jornada</b><span class="sp"></span><span class="who">${boss()?'Supervisor':esc(S.name)}</span></header><div class="wrap">${v}</div><div class="nav">${tabs.map(([k,i,n])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render();if(S.tab==='ajustes')checkPush()">${i}${n}</button>`).join('')}</div>`;
  if(TM&&!document.querySelector('.tbar'))tmBar();
}

// ---------- arranque ----------
(async()=>{
  applyTheme();
  const au=ls.get('jr_auth'),c=ls.get('jr_cache');
  if(au&&c){S.pin=au.pin;apply(c);render();if(await refresh())render();checkPush()}
  else render();
  setTimeout(installBanner,1200);if(TM)tmBar();
  setInterval(async()=>{if(S.code&&!document.querySelector('.modal')&&document.visibilityState==='visible'){if(await refresh())render()}},30000);
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&S.code&&!document.querySelector('.modal')){if(await refresh())render()}});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
